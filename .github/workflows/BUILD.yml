name: Build and install

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  pull-requests: write
  issues: write


concurrency:
  group: pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  build:    
    strategy:
      matrix:
        os: [ubuntu-latest]
        #os: [ubuntu-22.04, ubuntu-latest, macos-latest] # Usable when we also have execution scripts available

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Check ready state
        id: gate
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            return pr.data.labels.some(l => l.name === "ready")
              ? "true"
              : "false";

      - name: Stop if not ready
        if: steps.gate.outputs.result != 'true'
        run: |
          echo "Not ready → skipping build"
          exit 0

      # Check out the repository main folder
      - uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test-env
          init-shell: bash

      - name: Install dependencies
        shell: bash -l {0}
        run: |
          micromamba install conda --yes
          pip install .

      - name: Import test
        shell: bash -l {0}
        run: |
          python -c "import mmaseq"
