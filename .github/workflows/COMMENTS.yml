name: Ready enable CI

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  ready:
    runs-on: ubuntu-latest

    steps:
      - name: Enable ready label
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim();
            if (body !== "\\ready") return;

            const user = context.payload.comment.user.login;

            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: user
            });

            if (!["admin", "write"].includes(perm.data.permission)) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ["ready"]
            });

  unready:
    runs-on: ubuntu-latest

    steps:
      - name: Disable ready + cancel CI
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim();
            if (body !== "\\unready") return;

            const user = context.payload.comment.user.login;

            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: user
            });

            if (!["admin", "write"].includes(perm.data.permission)) return;

            const prNumber = context.issue.number;

            // remove ready label
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                name: "ready"
              });
            } catch {}

            // cancel running workflows for this PR (ONLY build/install jobs)
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              status: "in_progress"
            });

            for (const run of runs.data.workflow_runs) {
              if (!run.pull_requests.some(pr => pr.number === prNumber)) continue;

              // only cancel PR validation workflows (your install/build matrix)
              if (run.name !== "Pull Request Validation") continue;

              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }