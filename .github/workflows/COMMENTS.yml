name: Automatic comments

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  version-label:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim().toLowerCase();

            const command = body.replace(/^\\/, "");

            const mapping = {
              feature: "feature",
              patch: "patch",
              build: "build"
            };

            const label = mapping[command];
            if (!label) return;

            const user = context.payload.comment.user.login;

            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: user
            });

            if (!["admin", "write"].includes(perm.data.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "❌ You don't have permission to change version labels."
              });
              return;
            }

            const issue_number = context.issue.number;

            // fetch current labels
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const versionLabels = ["feature", "patch", "build"];

            // remove old version labels
            for (const existing of issue.data.labels.map(l => l.name)) {
              if (!versionLabels.includes(existing)) continue;

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name: existing
                });
              } catch (e) {
                console.log(`Could not remove label: ${existing}`, e.message);
              }
            }

            // apply new label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: [label]
            });

            // feedback
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ Version label set to **${label}**`
            });

  check-and-label:
    # 1. Must be a PR comment (not a plain issue)
    # 2. Comment must contain the command (e.g., /merge or trigger-merge)
    # 3. User MUST be an OWNER, MEMBER, or COLLABORATOR
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '/merge') && (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write

    steps:
      - name: Add merge label
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['merge']
            })
