name: Pull Request Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Assign label
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();

            let label = null;

            if (title.startsWith("fix") || title.startsWith("bug")) {
              label = "patch";
            } else if (
              title.startsWith("feat") ||
              title.startsWith("feature") ||
              title.startsWith("add")
            ) {
              label = "feature";
            } else if (
              title.startsWith("build") ||
              title.startsWith("pkg") ||
              title.startsWith("docs")
            ) {
              label = "build";
            }

            if (!label) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });

  check-label:
    needs: label
    runs-on: ubuntu-latest

    steps:
      - name: Validate labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const allowed = ["feature", "patch", "build"];

            const labels = pr.data.labels
              .map(l => l.name)
              .filter(l => allowed.includes(l));

            if (labels.length !== 1) {
              core.setFailed(`Must have exactly one version label. Found: ${labels.join(", ")}`);
            }

  build:
    needs: check-label

    if: contains(github.event.pull_request.labels.*.name, 'ready')

    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test-env
          init-shell: bash

      - name: Install
        shell: bash -l {0}
        run: |
          micromamba install conda --yes
          pip install .

      - name: Import test
        shell: bash -l {0}
        run: |
          python -c "import mmaseq"
