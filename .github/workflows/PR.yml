name: Pull Request Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: build-${{ github.event.pull_request.number || github.head_ref }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Assign label
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title.toLowerCase();

            let label = null;

            if (
              title.startsWith("fix") ||
              title.startsWith("bug")
            ) {label = "patch";}

            else if (
              title.startsWith("feat") ||
              title.startsWith("feature") ||
              title.startsWith("add") 
            ) {label = "feature";}

            else if (
              title.startsWith("build") ||
              title.startsWith("pkg") ||
              title.startsWith("docs") ||
              title.startsWith("github") ||
              title.startsWith("gh")
            ) {label = "build";}

            if (!label) {
              console.log("No matching label for title:", title);
              return;
            }

            const issue_number = context.issue.number;

            // fetch current labels
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const versionLabels = ["feature", "patch", "build"];

            // remove old version labels
            for (const existing of issue.data.labels.map(l => l.name)) {
              if (!versionLabels.includes(existing)) continue;

              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name: existing
              });
            }

            // apply new label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: [label]
            });

            // feedback
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ Version label set to **${label}**`
            });

  check-label:
    needs: label
    runs-on: ubuntu-latest

    steps:
      - name: Check labels
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
            
            // Get PR number from workflow run
            const pr_number = run.data.pull_requests[0]?.number;
            
            if (!pr_number) {
              core.setFailed('Could not find associated pull request');
              return;
            }
            
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });
            
            const labels = pr.data.labels
              .map(l => l.name)
              .filter(l =>
                ["feature","patch","build"].includes(l)
              );

            if (labels.length !== 1) {
              core.setFailed(
                `PR must contain exactly one version label (feature, patch, build). Found: ${labels.join(", ")}`
              );
            }

  build:
    needs: check-label
    strategy:
      matrix:

        os:
          - ubuntu-latest # ubuntu-22.04 # macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: test-env
          init-shell: bash

      - name: Test conda installation
        shell: bash -l {0}
        run: |
          micromamba install conda --yes

          # install package from repo
          pip install .

      - name: Verify package imports
        shell: bash -l {0}
        run: |
          mmaseq --version
