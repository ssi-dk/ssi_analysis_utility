name: Version label check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

jobs:
  check-version-label:
    runs-on: ubuntu-latest

    steps:
      - name: Check labels
        uses: actions/github-script@v7
        with:
          script: |
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const allowed = ["feature", "patch", "build});
            const found = labels.map(l => l.name).filter(n => allowed.includes(n));
            
            console.log("Detected labels:", found);
            
            if (found.length !== 1) {
              core.setFailed(
                `PR must contain exactly one version label (major, feature, patch, build). Found: ${found.join(", ")}`
              );
            }
