name: Bump and Merge

on:
  pull_request:
    types: [labeled]

jobs:
  bump-and-merge:
    # Only run if both a version label and a merge trigger label are present
    if: |
      contains(github.event.pull_request.labels.*.name, 'merge') && (
        contains(github.event.pull_request.labels.*.name, 'major') ||
        contains(github.event.pull_request.labels.*.name, 'feature') ||
        contains(github.event.pull_request.labels.*.name, 'patch') ||
        contains(github.event.pull_request.labels.*.name, 'build')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Extract Label
        id: label
        run: |
          echo "LABEL=${{
            contains(github.event.pull_request.labels.*.name, 'major') && 'major' ||
            contains(github.event.pull_request.labels.*.name, 'feature') && 'feature' ||
            'patch'
          }}" >> $GITHUB_OUTPUT

      - name: Bump Version
        run: |
          python .github/scripts/bump_version.py "${{ steps.label.outputs.LABEL }}"

      - name: Commit and Push to PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore(release): bump version before merge [skip ci]"
          git push

      - name: Automatically Merge PR
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash' # or 'merge' / 'rebase'
            })
