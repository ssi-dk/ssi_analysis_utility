name: Publish to PyPi and Bioconda

on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (e.g., 1.2.3)'
        required: true
      dry_run:
        description: 'Dry Run (Skip PyPI publish and Bioconda PR)'
        type: boolean
        default: true

jobs:
  pypi-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/MMASeq
    permissions:
      contents: read
      id-token: write # Required for PyPI Trusted Publishing (OIDC)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build tool
        run: python -m pip install build --user

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish package to PyPI
        if: ${{ inputs.dry_run != true }}
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Report Build Success
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "DRY RUN MODE: Package built successfully!"
          ls -la dist/
          
  bioconda-update:
    name: Update Bioconda Recipe & Open PR
    needs: pypi-publish
    runs-on: ubuntu-latest

    steps:
      - name: Wait 5 minutes for PyPI indexing
        run: |
          echo "Waiting 5 minutes to ensure PyPI indexing and sha256 generation..."
          sleep 300

      - name: Extract Tag / Version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            # Strip 'v' prefix if present (e.g., v1.0.0 -> 1.0.0)
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Fetch PyPI SHA256 Hash
        id: fetch_hash
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "DRY RUN MODE: Generating fake sha256"
            echo "SHA256=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855" >> $GITHUB_OUTPUT
          else
            VERSION="${{ steps.get_version.outputs.VERSION }}"
            JSON=$(curl -s "https://pypi.org/pypi/MMASeq/${VERSION}/json")
            SHA256=$(echo "$JSON" | jq -r '.urls[] | select(.packagetype=="sdist") | .digests.sha256')
            echo "SHA256=${SHA256}" >> $GITHUB_OUTPUT
          fi

      # 1. Checkout your FORK of bioconda-recipes
      - name: Checkout ssi-dk/bioconda-recipes Fork
        uses: actions/checkout@v4
        with:
          repository: 'ssi-dk/bioconda-recipes'
          token: ${{ secrets.BIOCONDA_TOKEN }}
          path: bioconda-recipes

      # 2. Modify meta.yaml inside the checked out fork
      - name: Update meta.yaml
        run: |
          cd bioconda-recipes/recipes/mmaseq
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          SHA256="${{ steps.fetch_hash.outputs.SHA256 }}"
          
          # Update version and sha256 in meta.yaml
          sed -i -E "s/{% set version = \".*\" %}/{% set version = \"${VERSION}\" %}/g" meta.yaml
          sed -i -E "s/sha256: .*/sha256: ${SHA256}/g" meta.yaml

      - name: Preview updated meta.yaml
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::group::Click to expand generated meta.yaml"
          cat mock_recipe/meta.yaml
          echo "::endgroup::"

      # 3. Create PR against bioconda/bioconda-recipes
      - name: Check Token Presence
        run: |
          if [ -z "${{ secrets.BIOCONDA_TOKEN }}" ]; then
            echo "WARNING: BIOCONDA_TOKEN secret is NOT set / has expired. Create a new token for the ssi-dk/bioconda-recipes in Profile settings > Credentials > Fine-grained personal access tokens.\nSkipping actual git push/PR creation."
          else
            echo "BIOCONDA_TOKEN secret is ready!"
          fi
        
      - name: Create Pull Request to Bioconda
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BIOCONDA_TOKEN }}
          path: bioconda-recipes
          commit-message: "mmaseq: bump version to ${{ steps.get_version.outputs.VERSION }}"
          title: "mmaseq: bump to version ${{ steps.get_version.outputs.VERSION }}"
          body: |
            Automated update for package `mmaseq` to version `${{ steps.get_version.outputs.VERSION }}`.
            
            - **Package:** `mmaseq`
            - **Version:** `${{ steps.get_version.outputs.VERSION }}`
            - **Source SHA256:** `${{ steps.fetch_hash.outputs.SHA256 }}`
          branch: "mmaseq-${{ steps.get_version.outputs.VERSION }}"
          base: "master" # Target branch on bioconda/bioconda-recipes
          # To target the master bioconda repo rather than the fork itself:
          push-to-fork: "ssi-dk/bioconda-recipes"
