name: Pull Requests label check

on:
  workflow_run:
    workflows: ["Pull Requests Automatic labelling"]
    types: [completed]

jobs:
  check-version-label:
    runs-on: ubuntu-latest

    steps:
      - name: Check labels
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id
            });
            
            // Get PR number from workflow run
            const pr_number = run.data.pull_requests[0]?.number;
            
            if (!pr_number) {
              core.setFailed('Could not find associated pull request');
              return;
            }
            
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr_number
            });
            
            const labels = pr.data.labels
              .map(l => l.name)
              .filter(l =>
                ["feature","patch","build"].includes(l)
              );

            if (labels.length !== 1) {
              core.setFailed(
                `PR must contain exactly one version label (feature, patch, build). Found: ${labels.join(", ")}`
              );
            }
