name: Label PR by Comment

on:
  issue_comment:
    types: [created]

jobs:
  version_labelling:
    if: ${{ github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Parse Command
        id: parse
        run: |
          COMMENT_BODY="${{ github.event.comment.body }}"
          if [[ "$COMMENT_BODY" == *"/minor"* ]]; then
            echo "Attaching new label 'minor'"
            echo "new_label=minor" >> $GITHUB_OUTPUT
          elif [[ "$COMMENT_BODY" == *"/patch"* ]]; then
            echo "Attaching new label 'patch'"
            echo "new_label=patch" >> $GITHUB_OUTPUT
          elif [[ "$COMMENT_BODY" == *"/build"* ]]; then
            echo "Attaching new label 'build'"
            echo "new_label=build" >> $GITHUB_OUTPUT
          else
            echo "Comment is not related to version labelling"
            exit 0
          fi
      - name: Authorize User
        id: authorize
        run: | 
          COMMENTER="${{ github.event.comment.user.login }}"
          PR_AUTHOR="${{ github.event.issue.user.login }}"
          ASSOCIATION="${{ github.event.comment.author_association }}"
          
          echo "Commenter: $COMMENTER"
          echo "PR Author: $PR_AUTHOR"
          echo "Association: $ASSOCIATION"
          
          # Allow if commenter is the PR author, the repo owner, or a collaborator
          if [ "$COMMENTER" = "$PR_AUTHOR" ] || [ "$ASSOCIATION" = "OWNER" ] || [ "$ASSOCIATION" = "COLLABORATOR" ] || [ "$ASSOCIATION" = "MEMBER" ]; then
            echo "Labelling comment authorized" 
            echo "authorized=true" >> $GITHUB_OUTPUT
          else
            echo "User not authorized to update version labels."
            echo "authorized=false" >> $GITHUB_OUTPUT
          fi
      - name: Update Labels
        if: steps.authorize.outputs.authorized == 'true' && steps.parse.outputs.new_label != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
          NEW_LABEL: ${{ steps.parse.outputs.new_label }}
        run: |
          CURRENT_LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          # Define conflicting versioning labels
          VERSION_LABELS=("major" "minor" "patch" "build")
          # Loop through current labels and remove any conflicting version labels
          for label in $CURRENT_LABELS; do
            if [[ " ${VERSION_LABELS[@]} " =~ " ${label} " ]]; then
              echo "Removing old label: $label"
              gh pr edit "$PR_NUMBER" --remove-label "$label"
            fi
          done
          # Apply the requested new label
          echo "Adding new label: $NEW_LABEL"
          gh pr edit "$PR_NUMBER" --add-label "$NEW_LABEL"
name: Automatic comments

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  pull-requests: write

jobs:
  version-label:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body.trim().toLowerCase();

            const command = body.replace(/^\\/, "");

            const mapping = {
              feature: "feature",
              patch: "patch",
              build: "build"
            };

            const label = mapping[command];
            if (!label) return;

            const user = context.payload.comment.user.login;

            const perm = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: user
            });

            if (!["admin", "write"].includes(perm.data.permission)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "❌ You don't have permission to change version labels."
              });
              return;
            }

            const issue_number = context.issue.number;

            // fetch current labels
            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const versionLabels = ["feature", "patch", "build"];

            // remove old version labels
            for (const existing of issue.data.labels.map(l => l.name)) {
              if (!versionLabels.includes(existing)) continue;

              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number,
                  name: existing
                });
              } catch (e) {
                console.log(`Could not remove label: ${existing}`, e.message);
              }
            }

            // apply new label
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              labels: [label]
            });

            // feedback
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: `✅ Version label set to **${label}**`
            });
