plasmidfinder:
  options: "-l 80 -t 80"
  assembler: shovill

blastn:
  options: "-perc_identity 99.0"
  assembler: shovill
  database : OXAndm

virulencefinder: true

serotypefinder: true

amrfinder: # Leave blank or insert --organism alongside one of the supported organisms, listed here: https://github.com/evolarjun/amr/wiki/Curated-organisms
    options: --organism 'Neisseria_meningitidis'
    assembler: shovill

mlst:
    assembler: shovill

meningotype:
    assembler: [shovill, skesa, spades]
