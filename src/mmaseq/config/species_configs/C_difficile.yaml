kmeraligner_wrangler:
    options: --organism 'Clostridioides difficile'
    database: CdiffToxins

snp_identifier:
    options: --organism 'Clostridioides difficile' --snp_region_buffer 5
    database: CdiffToxins

deletion_identifier:
    options: --organism 'Clostridioides difficile' --deletion_region_buffer 5 --overlap_fraction 0.5
    database: CdiffToxins
    assembler: [spades]

minimap2:
    options: -ax asm5 --cs
    database: CdiffToxins
    assembler: [spades]
    ignore: True

cdiff_repeat_identifier:
    repeats: TR6 TR10
    combos: TRST
    assembler: [spades, skesa]

amrfinder:
    options: --organism 'Clostridioides_difficile'
    assembler: spades 

mlst:
    assembler: spades  

samtools:
    view_options: -q 20
    sort_options: -n
    ignore: True

bcftools:
    view_options: -v indels -i 'INFO/DP>10'
    ignore: True